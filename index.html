<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Robin Mahato developer and IT portfolio focused on practical full-stack projects, IT systems, deployment, and real user problems."
    />
    <meta property="og:title" content="Robin Mahato | Developer & IT Portfolio" />
    <meta
      property="og:description"
      content="A concise portfolio for Robin Mahato, Bachelor of IT student and aspiring IT/software developer."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0a0f14" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Robin Mahato | Developer & IT Portfolio</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('portfolio-theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
